<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Outer Hex / Ring Gradient -->
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Core Isometric Cube Top -->
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Core Isometric Cube Left -->
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Core Isometric Cube Right -->
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Rounded Background -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <rect width="126" height="126" x="1" y="1" rx="27" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Outer Network Constellation Lines -->
  <g stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="3,3">
    <!-- Connecting outer nodes to central hub -->
    <line x1="64" y1="20" x2="64" y2="40" />
    <line x1="102" y1="42" x2="83" y2="53" />
    <line x1="102" y1="86" x2="83" y2="75" />
    <line x1="64" y1="108" x2="64" y2="88" />
    <line x1="26" y1="86" x2="45" y2="75" />
    <line x1="26" y1="42" x2="45" y2="53" />
  </g>

  <!-- Outer Network Perimeter Ring / Hexagon -->
  <polygon points="64,18 104,41 104,87 64,110 24,87 24,41"
           fill="none" stroke="url(#hexGrad)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Outer Satellite Nodes (Agent Squad Reps) -->
  <circle cx="64" cy="18" r="4.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="104" cy="41" r="4" fill="#818cf8" />
  <circle cx="104" cy="87" r="4" fill="#a855f7" />
  <circle cx="64" cy="110" r="4.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="24" cy="87" r="4" fill="#a855f7" />
  <circle cx="24" cy="41" r="4" fill="#818cf8" />

  <!-- Central Autonomous Architecture Cube (Isometric Enterprise Core) -->
  <g transform="translate(0, 0)">
    <!-- Top Face -->
    <polygon points="64,40 85,52 64,64 43,52" fill="url(#cubeTop)" />
    <!-- Left Face -->
    <polygon points="43,52 64,64 64,88 43,76" fill="url(#cubeLeft)" />
    <!-- Right Face -->
    <polygon points="64,64 85,52 85,76 64,88" fill="url(#cubeRight)" />

    <!-- Isometric Cube Edge Highlights -->
    <polyline points="43,52 64,64 85,52" fill="none" stroke="#93c5fd" stroke-width="1.2" stroke-linejoin="round" />
    <line x1="64" y1="64" x2="64" y2="88" stroke="#93c5fd" stroke-width="1.2" />

    <!-- Inner Core Glyph (Clean-room / Jev Determinism Spark) -->
    <circle cx="64" cy="64" r="5" fill="#ffffff" filter="url(#glow)" />
    <circle cx="64" cy="64" r="2.5" fill="#38bdf8" />
  </g>

  <!-- Enterprise AI Software Company Badge Text / Accents -->
  <g fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="600" text-anchor="middle" letter-spacing="1.5">
    <text x="64" y="102" fill="#38bdf8" opacity="0.9">ENTERPRISE AI</text>
  </g>
</svg>
